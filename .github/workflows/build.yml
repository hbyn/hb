name: C Build & Test

# 触发条件：推送到 main/master 分支，或有人提 PR 时自动编译
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    # ubuntu-latest 已预装 gcc 和 make，无需手动安装编译器
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 编译（make）
        run: make

      - name: 运行测试
        run: ./app
